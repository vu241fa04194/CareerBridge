services:
  - type: web
    name: careerbridge
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: careerbridge-fad53.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: careerbridge-fad53
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: careerbridge-fad53.firebasestorage.app
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        value: "278385166509"
      - key: VITE_FIREBASE_APP_ID
        value: "1:278385166509:web:546b8f6a729f625d4a9e24"
